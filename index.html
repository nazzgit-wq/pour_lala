<title>Souris Aéla 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #FBF6EF;
    --peach: #FDE2E4;
    --lavender: #E6E0F8;
    --mint: #DDF3EA;
    --ink: #3A2E33;
    --ink-soft: #8A7A80;
    --coral: #FF8FA3;
    --coral-deep: #E8637C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--peach) 45%, var(--lavender) 100%);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    position: relative;
    background-image: linear-gradient(160deg, rgba(251,246,239,0.55) 0%, rgba(253,226,228,0.55) 45%, rgba(230,224,248,0.55) 100%);
  }

  /*fleurs de lys */
  .fleur-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fill, 70px);
    justify-content: center;
    gap: 26px 34px;
    padding: 24px;
    pointer-events: none;
  }
  .fleur-bg svg {
    width: 34px;
    height: 34px;
    fill: var(--coral-deep);
    opacity: 0.16;
  }

  /*formes décoratives*/
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.55;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .blob.b1 { width: 140px; height: 140px; background: var(--mint); top: -40px; left: -30px; animation-delay: 0s; }
  .blob.b2 { width: 100px; height: 100px; background: var(--lavender); bottom: 10%; right: -30px; animation-delay: 2s; }
  .blob.b3 { width: 70px; height: 70px; background: var(--coral); opacity: 0.25; top: 20%; right: 8%; animation-delay: 4s; }
  .blob.b4 { width: 90px; height: 90px; background: var(--peach); bottom: -30px; left: 10%; animation-delay: 1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.05); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(255, 253, 250, 0.92);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 10px 40px -12px rgba(90, 60, 70, 0.25), 0 2px 8px rgba(90, 60, 70, 0.08);
    text-align: center;
    animation: popIn 0.6s cubic-bezier(.2,1.2,.3,1);
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.9) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .stamp {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--peach);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .eyebrow {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--coral-deep);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 22px;
    color: var(--ink);
  }

  .message {
    font-family: 'Poppins', sans-serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 22px;
    padding: 22px 18px;
    background: linear-gradient(135deg, var(--peach), var(--lavender));
    border-radius: 18px;
    display: none;
  }

  .message.show {
    display: block;
    animation: messageIn 0.5s cubic-bezier(.2,1.2,.3,1) both;
  }

  @keyframes messageIn {
    0% { opacity: 0; transform: scale(0.85) translateY(10px); }
    60% { opacity: 1; transform: scale(1.03) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .reveal-btn {
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--coral), var(--coral-deep));
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(232, 99, 124, 0.55);
    transition: transform 0.15s ease;
    animation: pulse 2.4s ease-in-out infinite;
  }

  .reveal-btn:active {
    transform: scale(0.94);
  }

  .reveal-btn.hidden {
    display: none;
  }

  .footer-note {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }

  .date {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 4px;
    font-weight: 500;
  }

  @media (max-width: 380px) {
    .card { padding: 32px 20px 26px; border-radius: 22px; }
    .message { font-size: 17px; padding: 18px 14px; }
  }
</style>
</head>
<body>
  <div class="fleur-bg" id="fleurBg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <main class="card">
    <div class="stamp">💌</div>
    <p class="eyebrow">Message du jour</p>
    <h1>Rien que pour toi ✨</h1>
    <p class="date" id="date"></p>
    <button class="reveal-btn" id="revealBtn">Ouvrir mon message 💌</button>
    <p class="message" id="message"></p>
  </main>

  <script>
    
    const MESSAGES = [
      "Penses à un petit tacos avec un bon cordon bleu sans jambon le tout au ketchup (atroce)",
      "Oublie pas que t'es aussi belle que mon pied Aéla 🦶",
      "Ta douceur et ta joie de vivre font un bien fou au quotidien Aéla (merci)",
      "Bon courage Aéla, ait confiance en toi t'es la meilleure (après moi 💅💅)",
      "Petit message pour vérifier que t'es bien réveillée et que t'as pas séché 😜 😜",
      "T'as vraiment le plus beau des sourires (à chaque fois que tu souris ça me fait sourire) ",
      "Merci d'être une si belle personne Aélaaaaaaaa",
      "Si tu vas mal oublie pas que je suis là pour toi (et Eneko)",
      "Tu comptes pour moi Aéla",
      "T'oublieras pas de prendre ta douche ça pue à travers l'écran hein Lorianna😷",
      "Oublie pas que je serais toujours plus drôle que toi mouahhahahahhaha",
      "A chaque fois que regarde tes yeux, j'ai comme envie de me perdre dedans pendant des heures (Nolann romantique)",
      "J'aime beaucoup ta façon de voir les choses Aéla (on se ressemble beaucoup d'ailleurs)",
    ];

    function seededShuffle(array, seed) {
      const result = [...array];
      let s = seed;
      const rand = () => {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    const SHUFFLED = seededShuffle(MESSAGES, 42);

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      return Math.floor(diff / 86400000);
    }

    const today = new Date();
    const index = getDayOfYear(today) % SHUFFLED.length;
    const todaysMessage = SHUFFLED[index];

    document.getElementById('message').textContent = todaysMessage;
    document.getElementById('date').textContent = today.toLocaleDateString('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long',
    });

    // Le message reste caché tant qu'elle n'a pas cliqué sur le bouton.
    document.getElementById('revealBtn').addEventListener('click', function () {
      document.getElementById('message').classList.add('show');
      this.classList.add('hidden');
    });

// Le fond
    const FLEUR_PATH =
      'M12 2S9 4 9 7 11 12 11 16H10S10 14 9 12C7 8 3 10 3 13S5 16 5 16C5 13 8.5 13 8.5 16H7V18H10.5L9 20S10 21 11 20L12 22L13 20C14 21 15 20 15 20L13.5 18H17V16H15.5C15.5 13 19 13 19 16C19 16 21 16 21 13S17 8 15 12C14 14 14 16 14 16H13C13 12 15 10 15 7S12 2 12 2Z';

    (function fillFleurBackground() {
      const container = document.getElementById('fleurBg');
      const cols = Math.ceil(window.innerWidth / 104) + 1;
      const rows = Math.ceil(window.innerHeight / 60) + 1;
      const count = cols * rows;
      const svgNS = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < count; i++) {
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', FLEUR_PATH);
        svg.appendChild(path);
        container.appendChild(svg);
      }
    })();
  </script>
</body>
</html>
